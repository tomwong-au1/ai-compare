                case 'OpenAI': return 'bg-emerald-950/60 text-emerald-400 border-emerald-800/50';
                case 'Anthropic': return 'bg-amber-950/60 text-amber-400 border-amber-800/50';
                case 'DeepSeek': return 'bg-blue-950/60 text-blue-400 border-blue-800/50';
                case 'Moonshot': return 'bg-indigo-950/60 text-indigo-400 border-indigo-800/50';
                case 'MoonshotAI': return 'bg-indigo-950/60 text-indigo-400 border-indigo-800/50';
                case 'Google': return 'bg-red-950/60 text-red-400 border-red-800/50';
                default: return 'bg-slate-800 text-slate-300';
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function formatPrice(pricePerMillionUSD, unit, currencyKey) {
            const currency = exchangeRates[currencyKey] || exchangeRates.USD;
            const divisor = unit === '1K' ? 1000 : 1;
            const amount = pricePerMillionUSD * currency.rate / divisor;
            const formatted = new Intl.NumberFormat(undefined, {
                maximumFractionDigits: 6,
                minimumFractionDigits: 2
            }).format(amount);
            return `${currency.symbol}${formatted}`;
        }

        function renderTable(data = models) {
            const tableBody = document.getElementById("modelTableBody");
            const noResults = document.getElementById("noResults");
            const currencyKey = document.getElementById("currencySelect").value;

            noResults.classList.toggle("hidden", data.length > 0);
            tableBody.innerHTML = data.map(model => {
                const modelUrl = `https://openrouter.ai/models/${escapeHtml(model.id)}`;
                const description = currentLang === 'zh'
                    ? (model.descriptionZh || model.description || model.id)
                    : (model.description || model.id);
                return `
                    <tr class="hover:bg-slate-900/60 transition-colors group">
                        <td class="py-4 px-6 font-semibold text-white">
                            <a class="hover:text-sky-400" href="${modelUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(model.name)}</a>
                        </td>
                        <td class="py-4 px-6 text-right font-mono text-slate-200">${formatPrice(model.inputUSD, activeUnit, currencyKey)}</td>
                        <td class="py-4 px-6 text-right font-mono text-slate-200">${formatPrice(model.outputUSD, activeUnit, currencyKey)}</td>
                        <td class="py-4 px-6 text-xs text-slate-400 max-w-xl leading-normal">${escapeHtml(description)}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterModels() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            selectedProvider = document.getElementById("providerSelect").value;
            const sourceModels = document.getElementById("featuredOnly").checked
                ? models.filter(model => DEFAULT_MODEL_IDS.has(model.id))
                : models;
            const filtered = sourceModels.filter(model => {
                const matchesQuery = `${model.name} ${model.id} ${model.provider} ${model.description} ${model.descriptionZh || ""}`.toLowerCase().includes(query);
                return matchesQuery && (selectedProvider === "All" || model.provider === selectedProvider);
            });
            renderTable(filtered);
        }

        async function loadModels() {
            const status = document.getElementById("apiStatus");
            status.innerText = currentLang === 'zh' ? "正在載入 OpenRouter 模型資料…" : "Loading OpenRouter models…";

            try {
                const response = await fetch("https://openrouter.ai/api/v1/models");
                if (!response.ok) throw new Error(`OpenRouter API returned ${response.status}`);
                const payload = await response.json();
                if (!Array.isArray(payload.data)) throw new Error("OpenRouter API response has no model list");

                models = payload.data.map(item => {
                    const inputPriceValue = item.pricing?.prompt;
                    const outputPriceValue = item.pricing?.completion;
                    const inputPrice = typeof inputPriceValue === "string" || typeof inputPriceValue === "number"
                        ? Number(inputPriceValue) : NaN;
                    const outputPrice = typeof outputPriceValue === "string" || typeof outputPriceValue === "number"
                        ? Number(outputPriceValue) : NaN;
                    const name = typeof item.name === "string" ? item.name : "";
                    const id = typeof item.id === "string" ? item.id : "";
                    const provider = name.includes(":") ? name.split(":")[0].trim() : id.split("/")[0];
                    return {
                        id,
                        name,
                        provider,
                        description: typeof item.description === "string" ? item.description : "",
                        descriptionZh: MODEL_DESCRIPTIONS_ZH[id] || "",
                        inputUSD: inputPrice * 1000000,
                        outputUSD: outputPrice * 1000000
                    };
                }).filter(model =>
                    model.id && model.name && model.provider &&
                    Number.isFinite(model.inputUSD) && model.inputUSD >= 0 &&
                    Number.isFinite(model.outputUSD) && model.outputUSD >= 0
                );

                if (models.length === 0) throw new Error("OpenRouter API returned no models with valid prices");
                models.sort((a, b) => a.name.localeCompare(b.name));

                const providers = [...new Set(models.map(model => model.provider))].sort((a, b) => a.localeCompare(b));
                const providerSelect = document.getElementById("providerSelect");
                providerSelect.replaceChildren(new Option(i18n[currentLang].btnAllProviders, "All"));
                providers.forEach(provider => providerSelect.add(new Option(provider, provider)));
                const featuredCount = models.filter(model => DEFAULT_MODEL_IDS.has(model.id)).length;
                status.innerText = currentLang === 'zh'
                    ? `資料來源：OpenRouter · 預設指定模型 ${featuredCount}/${DEFAULT_MODEL_IDS.size} 款 · 完整目錄 ${models.length} 款 · ${new Date().toLocaleString()}`
                    : `Source: OpenRouter · ${featuredCount}/${DEFAULT_MODEL_IDS.size} selected models · ${models.length} total · ${new Date().toLocaleString()}`;
                filterModels();
            } catch (error) {
                models = [];
                document.getElementById("modelTableBody").innerHTML = "";
                document.getElementById("noResults").classList.remove("hidden");
                status.innerText = currentLang === 'zh'
                    ? `無法載入 OpenRouter 資料：${error.message}`
                    : `Could not load OpenRouter data: ${error.message}`;
            }
        }

        // Unit Toggle (1M vs 1K)
        function setUnit(unit) {
            activeUnit = unit;
            const btn1M = document.getElementById('unit1M');
            const btn1K = document.getElementById('unit1K');
            
            if (unit === '1M') {
                btn1M.className = "px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all";
                btn1K.className = "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all";
            } else {
                btn1K.className = "px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all";
                btn1M.className = "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all";
            }
            updateDisplay();
        }

        // Column Sort
        function sortTable(key) {
            let dir = sortDirection[key] === 'asc' ? 'desc' : 'asc';
            sortDirection[key] = dir;

            models.sort((a, b) => {
                let valA = key === 'input' ? a.inputUSD : key === 'output' ? a.outputUSD : a.name;
                let valB = key === 'input' ? b.inputUSD : key === 'output' ? b.outputUSD : b.name;

                if (valA < valB) return dir === 'asc' ? -1 : 1;
                if (valA > valB) return dir === 'asc' ? 1 : -1;
                return 0;
            });
            filterModels();
        }

        // Global Display Refresh
        function updateDisplay() {
            filterModels();
        }

        // Initial Load setup
        window.onload = function() {
            models = [];
            setLanguage('zh');
            loadModels();
        };
    </script>
</body>
</html>
