<body class="min-h-screen pb-12 antialiased selection:bg-sky-500 selection:text-white" data-theme="black">

    <!-- Top Header -->
    <header class="border-b border-slate-800/80 bg-slate-950/60 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-microchip text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-sky-400 bg-clip-text text-transparent">
                        AI Model API Pricing Index
                    </h1>
                    <p class="text-xs text-slate-400" id="siteSubtitle">OpenRouter 即時模型目錄及價格</p>
                </div>
            </div>

            <!-- Currency & Unit Selector Controls -->
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center bg-slate-900/90 border border-slate-800 rounded-lg p-1" role="group" aria-label="背景顏色">
                    <button id="themeWhite" onclick="setTheme('white')" aria-pressed="false" class="px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all">白色</button>
                    <button id="themeBlack" onclick="setTheme('black')" aria-pressed="true" class="px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all">黑色</button>
                </div>

                <!-- Language Selector -->
                <div class="flex items-center bg-slate-900/90 border border-slate-800 rounded-lg p-1">
                    <i class="fa-solid fa-globe text-xs text-slate-400 pl-2"></i>
                    <select id="langSelect" onchange="setLanguage(this.value)" class="bg-slate-800 text-xs text-slate-200 font-semibold rounded px-2 py-1 outline-none border-none focus:ring-1 focus:ring-sky-500 cursor-pointer ml-1">
                        <option value="zh" selected>繁體中文</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <!-- Currency Selector -->
                <div class="flex items-center bg-slate-900/90 border border-slate-800 rounded-lg p-1">
                    <span class="text-xs text-slate-400 px-2 font-medium" id="lblCurrency">貨幣:</span>
                    <select id="currencySelect" onchange="updateDisplay()" class="bg-slate-800 text-xs text-slate-200 font-semibold rounded px-2 py-1 outline-none border-none focus:ring-1 focus:ring-sky-500 cursor-pointer">
                        <option value="USD" selected>USD ($)</option>
                        <option value="AUD">AUD (A$)</option>
                        <option value="HKD">HKD (HK$)</option>
                    </select>
                </div>

                <div class="flex items-center bg-slate-900/90 border border-slate-800 rounded-lg p-1">
                    <button id="unit1M" onclick="setUnit('1M')" class="px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all">Per 1M Tokens</button>
                    <button id="unit1K" onclick="setUnit('1K')" class="px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all">Per 1K Tokens</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-8">

        <!-- Search, Filter & Table Container -->
        <section class="glass-card rounded-2xl overflow-hidden border border-slate-800">
            <!-- Toolbar -->
            <div class="p-4 sm:p-6 border-b border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <!-- Search Box -->
                <div class="relative flex-1 max-w-md">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                    <input type="text" id="searchInput" oninput="filterModels()" placeholder="搜尋模型名稱、ID 或說明..."
                        class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all">
                </div>

                <div class="flex flex-wrap items-center gap-3">
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input id="featuredOnly" type="checkbox" checked onchange="filterModels()" class="accent-sky-500">
                        <span id="featuredOnlyLabel">只顯示指定模型</span>
                    </label>
                    <label class="sr-only" for="providerSelect" id="providerFilterLabel">供應商篩選</label>
                    <select id="providerSelect" onchange="filterModels()" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="All">全部供應商</option>
                    </select>
                </div>
            </div>

            <!-- Pricing Table -->
            <div class="overflow-x-auto">
                <table id="modelTable" class="w-full min-w-[1400px] table-fixed text-left border-collapse">
                    <colgroup>
                        <col style="width: 20%">
                        <col style="width: 10%">
                        <col style="width: 10%">
                        <col style="width: 10%">
                        <col style="width: 10%">
                        <col style="width: 10%">
                        <col style="width: 10%">
                        <col style="width: 20%">
                    </colgroup>
                    <thead>
                        <tr class="bg-slate-950/70 border-b border-slate-800 text-slate-400 text-xs font-semibold uppercase tracking-wider">
                            <th class="relative py-4 px-6 cursor-pointer hover:text-white transition-colors" onclick="sortTable('name')">
                                <span id="thModelName">模型名稱</span> <i class="fa-solid fa-sort text-slate-600 ml-1"></i>
                                <button type="button" class="column-resize-handle" data-resize-boundary="0" aria-label="調整模型名稱欄闊度" title="拖曳以調整欄闊度"><span aria-hidden="true"></span></button>
                            </th>
                            <th class="relative py-4 px-6 text-right cursor-pointer hover:text-white transition-colors" onclick="sortTable('input')">
                                <span id="thInputPrice">輸入單價</span> <i class="fa-solid fa-sort text-slate-600 ml-1"></i>
                                <button type="button" class="column-resize-handle" data-resize-boundary="1" aria-label="調整輸入單價欄闊度" title="拖曳以調整欄闊度"><span aria-hidden="true"></span></button>
                            </th>
                            <th class="relative py-4 px-6 text-right cursor-pointer hover:text-white transition-colors" onclick="sortTable('output')">
                                <span id="thOutputPrice">輸出單價</span> <i class="fa-solid fa-sort text-slate-600 ml-1"></i>
                                <button type="button" class="column-resize-handle" data-resize-boundary="2" aria-label="調整輸出單價欄闊度" title="拖曳以調整欄闊度"><span aria-hidden="true"></span></button>
                            </th>
                            <th class="relative py-4 px-6 text-right cursor-pointer hover:text-white transition-colors" onclick="sortTable('intelligenceIndex')">
                                <span id="thIntelligenceIndex">智能指數</span> <i class="fa-solid fa-sort text-slate-600 ml-1"></i>
                                <button type="button" class="column-resize-handle" data-resize-boundary="3" aria-label="調整 Intelligence Index 欄闊度" title="拖曳以調整欄闊度"><span aria-hidden="true"></span></button>
                            </th>
                            <th class="relative py-4 px-6 text-right cursor-pointer hover:text-white transition-colors" onclick="sortTable('codingIndex')">
                                <span id="thCodingIndex">編碼指數</span> <i class="fa-solid fa-sort text-slate-600 ml-1"></i>
                                <button type="button" class="column-resize-handle" data-resize-boundary="4" aria-label="調整 Coding Index 欄闊度" title="拖曳以調整欄闊度"><span aria-hidden="true"></span></button>
                            </th>
                            <th class="relative py-4 px-6 text-right cursor-pointer hover:text-white transition-colors" onclick="sortTable('agenticIndex')">
                                <span id="thAgenticIndex">代理指數</span> <i class="fa-solid fa-sort text-slate-600 ml-1"></i>
                                <button type="button" class="column-resize-handle" data-resize-boundary="5" aria-label="調整 Agentic Index 欄闊度" title="拖曳以調整欄闊度"><span aria-hidden="true"></span></button>
                            </th>
                            <th class="relative py-4 px-6 cursor-pointer hover:text-white transition-colors" onclick="sortTable('level')">
                                <span id="thModelLevel">模型級數</span> <i class="fa-solid fa-sort text-slate-600 ml-1"></i>
                                <button type="button" class="column-resize-handle" data-resize-boundary="6" aria-label="調整模型級數欄闊度" title="拖曳以調整欄闊度"><span aria-hidden="true"></span></button>
                            </th>
                            <th class="py-4 px-6" id="thDetails">說明</th>
                        </tr>
                    </thead>
                    <tbody id="modelTableBody" class="divide-y divide-slate-800/60 text-sm font-medium">
                        <!-- Rendered via JavaScript -->
                    </tbody>
                </table>
            </div>
            <p id="modelLevelNote" class="border-t border-slate-800 px-4 py-3 text-xs text-slate-500 sm:px-6">
                模型級數由高至低：旗艦級（最強定位）、高階、中階、輕量級（偏速度／成本）、一般級（資料不足）。分類按模型系列定位或名稱推定，並非效能測試排名。
            </p>

            <!-- Empty State -->
            <div id="noResults" class="hidden p-12 text-center text-slate-500">
                <i class="fa-solid fa-ghost text-4xl mb-3 text-slate-600"></i>
                <p class="text-base font-semibold" id="noResultsTitle">未找到符合條件的 AI 模型</p>
                <p class="text-xs text-slate-600 mt-1" id="noResultsDesc">請嘗試搜尋其他關鍵字或重設供應商篩選器。</p>
            </div>
        </section>

        <p id="apiStatus" class="text-xs text-slate-500 text-center" role="status">正在載入 OpenRouter 模型資料…</p>
    </main>

    <!-- Footer -->
    <footer class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 text-center text-xs text-slate-500">
        <div class="border-t border-slate-800/80 pt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p id="footerCopy">價格由 OpenRouter 公開 API 提供；非模型供應商直接報價。</p>
            <div class="flex items-center space-x-4">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-circle text-[8px] text-emerald-400"></i> <a class="hover:text-sky-400" href="https://openrouter.ai/models" target="_blank" rel="noopener noreferrer">OpenRouter 模型目錄</a></span>

            </div>

    </footer>

    <script>
        // Language i18n Dictionary
        const i18n = {

                thModelName: "模型名稱",
                thModelLevel: "模型級數",
                thInputPrice: "輸入單價",
                thOutputPrice: "輸出單價",
                thIntelligenceIndex: "智能指數",
                thCodingIndex: "編碼指數",
                thAgenticIndex: "代理指數",
                thDetails: "模型說明",
                noResultsTitle: "未找到符合條件的 AI 模型",
                noResultsDesc: "請嘗試其他搜尋字詞或供應商。",
                modelLevelNote: "模型級數由高至低：旗艦級（最強定位）、高階、中階、輕量級（偏速度／成本）、一般級（資料不足）。分類按模型系列定位或名稱推定，並非效能測試排名。",
                footerCopy: "價格由 OpenRouter 公開 API 提供，並不代表模型供應商直接報價。",
                footerStatus2: "OpenRouter 即時資料",
                unit1M: "每 1M Tokens",
                unit1K: "每 1K Tokens"
            },
            en: {
                title: "AI Model API Pricing Directory",
                subtitle: "Live model catalog and pricing from OpenRouter",
                currencyLbl: "Currency:",
                themeWhite: "White",
                themeBlack: "Black",
                searchPlaceholder: "Search model name, ID, or description...",
                btnAllProviders: "All providers",
                featuredOnlyLabel: "Show selected models only",
                columnResizeLabels: ["Resize Model Name column", "Resize Input Price column", "Resize Output Price column", "Resize Intelligence Index column", "Resize Coding Index column", "Resize Agentic Index column", "Resize Model Level column"],
                thModelName: "Model Name",
                thModelLevel: "Model Level",
                thInputPrice: "Input Price",
                thOutputPrice: "Output Price",
                thIntelligenceIndex: "Intelligence Index",
                thCodingIndex: "Coding Index",
                thAgenticIndex: "Agentic Index",
                thDetails: "Description",
                noResultsTitle: "No AI models matched your search",
                noResultsDesc: "Try a different search term or provider.",
                modelLevelNote: "From highest to lowest: Flagship, Advanced, Mid-range, Lightweight (speed/cost-focused), and General (insufficient information). Levels are estimates based on model family positioning or names, not benchmark rankings.",

                footerStatus2: "Live OpenRouter data",
                unit1M: "Per 1M Tokens",
                unit1K: "Per 1K Tokens"

        // Current Language Choice (Default Traditional Chinese 'zh')
        let currentLang = 'zh';

        let DEFAULT_MODEL_IDS = new Set();
        let MODEL_LEVEL_BY_ID = {};
        let MODEL_DESCRIPTIONS_ZH = {};
        let MODEL_INDEXES_BY_ID = {};
        let EXCLUDED_MODEL_ID_PREFIXES = [];

        const MODEL_LEVELS = {
            flagship: { rank: 0, zh: "旗艦級", en: "Flagship", badge: "model-level-flagship bg-purple-500/10 text-purple-400 border-purple-500/20" },
            advanced: { rank: 1, zh: "高階", en: "Advanced", badge: "model-level-advanced bg-sky-500/10 text-sky-400 border-sky-500/20" },
            intermediate: { rank: 2, zh: "中階", en: "Mid-range", badge: "model-level-intermediate bg-amber-500/10 text-amber-400 border-amber-500/20" },
            lightweight: { rank: 3, zh: "輕量級", en: "Lightweight", badge: "model-level-lightweight bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
            general: { rank: 4, zh: "一般級", en: "General", badge: "model-level-general bg-slate-800 text-slate-300 border-slate-700" }
        };

        function getModelLevel(id, name) {
            if (MODEL_LEVEL_BY_ID[id]) return MODEL_LEVEL_BY_ID[id];

            const modelName = `${id} ${name}`.toLowerCase();
            if (/\b(?:haiku|flash|mini|nano|lite|small|tiny|instant|fast|edge)\b|(?:^|[-_/])(?:1|3|7|8)b(?:[-_/]|$)/i.test(modelName)) return "lightweight";
            if (/\b(?:opus|reasoner|reasoning|thinking|ultra|flagship)\b|(?:^|[-_/ ])(?:pro|max)(?:[-_/:. ]|$)|(?:70|72|100|110|120|235|405)b\b/i.test(modelName)) return "flagship";
            if (/\b(?:sonnet|plus|medium)\b|(?:32|34|40)b\b/i.test(modelName)) return "advanced";
            if (/\b(?:standard|balanced|base)\b|(?:14|16|20|27|30)b\b/i.test(modelName)) return "intermediate";
            return "general";
        }

        // Model Pricing Database (Base USD)
        let models = [
            {
                name: "DeepSeek V4.1",
                provider: "DeepSeek",
                tierKey: "tierUltraLight",

            {
                name: "GPT 6.1 Terra",
                provider: "OpenAI",
                tierKey: "tierBalanced",
                tierBadge: "bg-sky-500/10 text-sky-400 border-sky-500/20",
                inputUSD: 1.00,

        // Currency Exchange Rates (Base USD)
        const exchangeRates = {

        function applyColumnResize(boundary, deltaPercent) {
            const minimumWidths = [14, 7, 7, 7, 7, 7, 7, 12];
            const adjacentWidth = columnWidths[boundary] + columnWidths[boundary + 1];
            const nextLeftWidth = Math.min(
                adjacentWidth - minimumWidths[boundary + 1],
                Math.max(minimumWidths[boundary], columnWidths[boundary] + deltaPercent)
            );
            columnWidths[boundary] = nextLeftWidth;
            columnWidths[boundary + 1] = adjacentWidth - nextLeftWidth;
            document.querySelectorAll('#modelTable colgroup col').forEach((column, index) => {
                column.style.width = `${columnWidths[index]}%`;
            });
        }

        function initializeColumnResizers() {
            document.querySelectorAll('.column-resize-handle').forEach(handle => {
                handle.addEventListener('pointerdown', event => {
                    event.preventDefault();
                    event.stopPropagation();
                    const boundary = Number(handle.dataset.resizeBoundary);
                    activeColumnResize = {
                        boundary,
                        startX: event.clientX,
                        startWidths: [...columnWidths],
                        tableWidth: document.getElementById('modelTable').getBoundingClientRect().width
                    };
                    handle.classList.add('is-resizing');
                    document.body.classList.add('is-resizing-columns');
                    handle.setPointerCapture(event.pointerId);
                });
                handle.addEventListener('pointermove', event => {
                    if (!activeColumnResize || !handle.hasPointerCapture(event.pointerId)) return;
                    columnWidths = [...activeColumnResize.startWidths];
                    applyColumnResize(
                        activeColumnResize.boundary,
                        (event.clientX - activeColumnResize.startX) / activeColumnResize.tableWidth * 100
                    );
                });
                const finishResize = event => {
                    if (!activeColumnResize || activeColumnResize.boundary !== Number(handle.dataset.resizeBoundary)) return;
                    if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
                    activeColumnResize = null;
                    handle.classList.remove('is-resizing');
                    document.body.classList.remove('is-resizing-columns');
                };
                handle.addEventListener('pointerup', finishResize);
                handle.addEventListener('pointercancel', finishResize);
                handle.addEventListener('keydown', event => {
                    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
                    event.preventDefault();
                    event.stopPropagation();
                    applyColumnResize(Number(handle.dataset.resizeBoundary), event.key === 'ArrowRight' ? 1 : -1);
                });
                handle.addEventListener('click', event => event.stopPropagation());
            });
        }

        function setTheme(theme) {
            const isWhite = theme === 'white';
            document.body.dataset.theme = isWhite ? 'white' : 'black';

            const whiteButton = document.getElementById('themeWhite');
            const blackButton = document.getElementById('themeBlack');
            whiteButton.setAttribute('aria-pressed', String(isWhite));
            blackButton.setAttribute('aria-pressed', String(!isWhite));
            whiteButton.className = isWhite
                ? "px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all"
                : "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all";
            blackButton.className = isWhite
                ? "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all"
                : "px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all";
        }

        // Provider Badge Generator
        function getProviderBadge(provider) {
            switch(provider) {
                case 'OpenAI': return 'bg-emerald-950/60 text-emerald-400 border-emerald-800/50';
                case 'Anthropic': return 'bg-amber-950/60 text-amber-400 border-amber-800/50';
                case 'DeepSeek': return 'bg-blue-950/60 text-blue-400 border-blue-800/50';
                case 'Moonshot': return 'bg-indigo-950/60 text-indigo-400 border-indigo-800/50';
                case 'MoonshotAI': return 'bg-indigo-950/60 text-indigo-400 border-indigo-800/50';
                case 'Google': return 'bg-red-950/60 text-red-400 border-red-800/50';
                default: return 'bg-slate-800 text-slate-300';
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function formatPrice(pricePerMillionUSD, unit, currencyKey) {
            const currency = exchangeRates[currencyKey] || exchangeRates.USD;
            const divisor = unit === '1K' ? 1000 : 1;
            const amount = pricePerMillionUSD * currency.rate / divisor;
            const formatted = new Intl.NumberFormat(undefined, {
                maximumFractionDigits: 6,
                minimumFractionDigits: 2
            }).format(amount);
            return `${currency.symbol}${formatted}`;
        }

        function formatIndex(value) {
            return Number.isFinite(value) ? value.toFixed(1) : "—";
        }

        function renderTable(data = models) {
            const tableBody = document.getElementById("modelTableBody");
            const noResults = document.getElementById("noResults");
            const currencyKey = document.getElementById("currencySelect").value;

            noResults.classList.toggle("hidden", data.length > 0);
            tableBody.innerHTML = data.map(model => {
                const modelUrl = `https://openrouter.ai/models/${escapeHtml(model.id)}`;
                const description = currentLang === 'zh'
                    ? (model.descriptionZh || model.description || model.id)
                    : (model.description || model.id);
                const level = MODEL_LEVELS[model.modelLevel] || MODEL_LEVELS.general;
                return `
                    <tr class="hover:bg-slate-900/60 transition-colors group">
                        <td class="py-4 px-6 font-semibold text-white">
                            <a class="hover:text-sky-400" href="${modelUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(model.name)}</a>
                        </td>
                        <td class="py-4 px-6 text-right font-mono text-slate-200">${formatPrice(model.inputUSD, activeUnit, currencyKey)}</td>
                        <td class="py-4 px-6 text-right font-mono text-slate-200">${formatPrice(model.outputUSD, activeUnit, currencyKey)}</td>
                        <td class="py-4 px-6 text-right font-mono text-slate-200">${formatIndex(model.intelligenceIndex)}</td>
                        <td class="py-4 px-6 text-right font-mono text-slate-200">${formatIndex(model.codingIndex)}</td>
                        <td class="py-4 px-6 text-right font-mono text-slate-200">${formatIndex(model.agenticIndex)}</td>
                        <td class="py-4 px-6">
                            <span class="model-level-badge inline-flex whitespace-nowrap rounded-md border px-2.5 py-1 text-xs font-medium ${level.badge}">${currentLang === 'zh' ? level.zh : level.en}</span>
                        </td>
                        <td class="py-4 px-6 text-xs text-slate-400 max-w-xl leading-normal">${escapeHtml(description)}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterModels() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            selectedProvider = document.getElementById("providerSelect").value;
            const sourceModels = document.getElementById("featuredOnly").checked
                ? models.filter(model => DEFAULT_MODEL_IDS.has(model.id))
                : models;
            const filtered = sourceModels.filter(model => {
                const matchesQuery = `${model.name} ${model.id} ${model.provider} ${model.description} ${model.descriptionZh || ""}`.toLowerCase().includes(query);
                return matchesQuery && (selectedProvider === "All" || model.provider === selectedProvider);
            });
            renderTable(filtered);
        }

        async function loadModels() {
            const status = document.getElementById("apiStatus");
            status.innerText = currentLang === 'zh' ? "正在載入模型清單及 OpenRouter 資料…" : "Loading model list and OpenRouter data…";

            try {
                const [configResponse, response] = await Promise.all([
                    fetch("./models.json"),
                    fetch("https://openrouter.ai/api/v1/models")
                ]);
                if (!configResponse.ok) throw new Error(`models.json returned ${configResponse.status}`);
                const config = await configResponse.json();
                if (!config || typeof config !== "object" || Array.isArray(config) ||
                    !Array.isArray(config.featuredModels) ||
                    !Array.isArray(config.excludedModelIdPrefixes) ||
                    !config.modelIndices || typeof config.modelIndices !== "object" ||
                    Array.isArray(config.modelIndices)) {
                    throw new Error("models.json has an invalid configuration");
                }

                const isValidFeaturedModel = model =>
                    model && typeof model === "object" && !Array.isArray(model) &&
                    typeof model.id === "string" && model.id.trim() !== "" &&
                    (model.level === undefined || Object.prototype.hasOwnProperty.call(MODEL_LEVELS, model.level)) &&
                    (model.descriptionZh === undefined || typeof model.descriptionZh === "string");
                if (!config.featuredModels.every(isValidFeaturedModel) ||
                    !config.excludedModelIdPrefixes.every(prefix => typeof prefix === "string" && prefix.trim() !== "")) {
                    throw new Error("models.json contains an invalid model entry");
                }
                const validIndexNames = ["intelligence", "coding", "agentic"];
                const isValidIndexRecord = record =>
                    record && typeof record === "object" && !Array.isArray(record) &&
                    Object.entries(record).every(([name, value]) =>
                        validIndexNames.includes(name) &&
                        (value === null || (typeof value === "number" && Number.isFinite(value) && value >= 0))
                    );
                if (Object.entries(config.modelIndices).some(([id, record]) => !id.trim() || !isValidIndexRecord(record))) {
                    throw new Error("models.json contains an invalid model index");
                }

                DEFAULT_MODEL_IDS = new Set(config.featuredModels.map(model => model.id.trim()));
                MODEL_LEVEL_BY_ID = Object.fromEntries(config.featuredModels
                    .filter(model => model.level !== undefined)
                    .map(model => [model.id.trim(), model.level]));
                MODEL_DESCRIPTIONS_ZH = Object.fromEntries(config.featuredModels
                    .filter(model => model.descriptionZh !== undefined)
                    .map(model => [model.id.trim(), model.descriptionZh]));
                MODEL_INDEXES_BY_ID = Object.fromEntries(Object.entries(config.modelIndices).map(([id, indexes]) => [
                    id.trim(),
                    {
                        intelligenceIndex: indexes.intelligence ?? null,
                        codingIndex: indexes.coding ?? null,
                        agenticIndex: indexes.agentic ?? null
                    }
                ]));
                EXCLUDED_MODEL_ID_PREFIXES = config.excludedModelIdPrefixes.map(prefix => prefix.trim());

                if (!response.ok) throw new Error(`OpenRouter API returned ${response.status}`);
                const payload = await response.json();
                if (!Array.isArray(payload.data)) throw new Error("OpenRouter API response has no model list");

                models = payload.data
                    .filter(item => typeof item.id !== "string" ||
                        !EXCLUDED_MODEL_ID_PREFIXES.some(prefix => item.id.startsWith(prefix)))
                    .map(item => {
                        const inputPriceValue = item.pricing?.prompt;
                        const outputPriceValue = item.pricing?.completion;
                        const inputPrice = typeof inputPriceValue === "string" || typeof inputPriceValue === "number"
                            ? Number(inputPriceValue) : NaN;
                        const outputPrice = typeof outputPriceValue === "string" || typeof outputPriceValue === "number"
                            ? Number(outputPriceValue) : NaN;
                        const name = typeof item.name === "string" ? item.name : "";
                        const id = typeof item.id === "string" ? item.id : "";
                        const indexes = MODEL_INDEXES_BY_ID[id] || {};
                        const provider = name.includes(":") ? name.split(":")[0].trim() : id.split("/")[0];
                        return {
                            id,
                            name,
                            provider,
                            modelLevel: getModelLevel(id, name),
                            description: typeof item.description === "string" ? item.description : "",
                            descriptionZh: MODEL_DESCRIPTIONS_ZH[id] || "",
                            intelligenceIndex: indexes.intelligenceIndex ?? null,
                            codingIndex: indexes.codingIndex ?? null,
                            agenticIndex: indexes.agenticIndex ?? null,
                            inputUSD: inputPrice * 1000000,
                            outputUSD: outputPrice * 1000000
                        };
                    }).filter(model =>
                        model.id && model.name && model.provider &&
                        Number.isFinite(model.inputUSD) && model.inputUSD >= 0 &&
                        Number.isFinite(model.outputUSD) && model.outputUSD >= 0
                    );

                if (models.length === 0) throw new Error("OpenRouter API returned no models with valid prices");
                models.sort((a, b) => a.name.localeCompare(b.name));

                const providers = [...new Set(models.map(model => model.provider))].sort((a, b) => a.localeCompare(b));
                const providerSelect = document.getElementById("providerSelect");
                providerSelect.replaceChildren(new Option(i18n[currentLang].btnAllProviders, "All"));
                providers.forEach(provider => providerSelect.add(new Option(provider, provider)));
                const featuredCount = models.filter(model => DEFAULT_MODEL_IDS.has(model.id)).length;
                status.innerText = currentLang === 'zh'
                    ? `資料來源：OpenRouter · 預設指定模型 ${featuredCount}/${DEFAULT_MODEL_IDS.size} 款 · 可用型錄 ${models.length} 款 · ${new Date().toLocaleString()}`
                    : `Source: OpenRouter · ${featuredCount}/${DEFAULT_MODEL_IDS.size} selected models · ${models.length} total · ${new Date().toLocaleString()}`;
                filterModels();
            } catch (error) {
                models = [];
                document.getElementById("modelTableBody").innerHTML = "";
                document.getElementById("noResults").classList.remove("hidden");
                status.innerText = currentLang === 'zh'
                    ? `無法載入模型清單或 OpenRouter 資料：${error.message}`
                    : `Could not load the model list or OpenRouter data: ${error.message}`;
            }
        }

        // Unit Toggle (1M vs 1K)
        function setUnit(unit) {
            activeUnit = unit;
            const btn1M = document.getElementById('unit1M');
            const btn1K = document.getElementById('unit1K');
            
            if (unit === '1M') {
                btn1M.className = "px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all";
                btn1K.className = "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all";
            } else {
                btn1K.className = "px-3 py-1 text-xs font-semibold rounded bg-sky-500 text-white transition-all";
                btn1M.className = "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition-all";
            }
            updateDisplay();
        }

        // Column Sort
        function sortTable(key) {
            let dir = sortDirection[key] === 'asc' ? 'desc' : 'asc';
            const sortValues = {
                name: model => model.name,
                level: model => (MODEL_LEVELS[model.modelLevel] || MODEL_LEVELS.general).rank,
                input: model => model.inputUSD,
                output: model => model.outputUSD,
                intelligenceIndex: model => model.intelligenceIndex,
                codingIndex: model => model.codingIndex,
                agenticIndex: model => model.agenticIndex
            };
            const getValue = sortValues[key];
            if (!getValue) return;
            sortDirection[key] = dir;

            models.sort((a, b) => {
                const valA = getValue(a);
                const valB = getValue(b);
                const missingA = valA === null || valA === undefined || (typeof valA === "number" && !Number.isFinite(valA));
                const missingB = valB === null || valB === undefined || (typeof valB === "number" && !Number.isFinite(valB));
                if (missingA || missingB) {
                    if (missingA && missingB) return a.name.localeCompare(b.name);
                    return missingA ? 1 : -1;
                }

                const comparison = typeof valA === "string" ? valA.localeCompare(valB) : valA - valB;
                if (comparison === 0) return a.name.localeCompare(b.name);
                return dir === 'asc' ? comparison : -comparison;
            });
            filterModels();
        }

        // Global Display Refresh
        function updateDisplay() {
            filterModels();
        }

        // Initial Load setup
        window.onload = function() {
            models = [];
            initializeColumnResizers();
            setLanguage('zh');
            loadModels();
        };
    </script>
